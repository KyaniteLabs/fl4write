name: ci
on:
  push: {branches: [main]}
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    steps:
      - name: Install checkout runtime
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {persist-credentials: false}
      - run: pip install -e ".[dev]"
      - run: python3 -m ruff check .
      - run: python3 -m pytest tests/ -q
        timeout-minutes: 25
