name: Mutation
# Advisory Layer 2 lane: measures whether the tests actually detect injected
# defects in the gatekeeper (fl4write/gatekeeper.py) — the filter that
# decides which findings get posted across the fleet. Not a required check
# (~2 min clean); the run goes red if the mutation score drops below 94%
# (baseline 96.9% = killed/(killed+survived+timeout), the formula below), so a weakening of the tests is visible
# without blocking merges.
on:
  schedule:
    - cron: "53 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  mutation:
    name: mutation-score
    runs-on: docker
    timeout-minutes: 30
    container:
      image: python:3.12-bookworm@sha256:14a4933e6cef421424f7a66d89a3f4eafcbd0d90e0a822251f298e05132dc735
    steps:
      - name: Install checkout runtime (actions/checkout needs node + git)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install deps and pinned mutmut
        run: python3 -m pip install --no-cache-dir -e ".[dev]" mutmut==3.8.0
      - name: Mutation score of the gatekeeper (break below 94%)
        run: |
          mutmut run
          mutmut export-cicd-stats
          python3 - <<'PY'
          import json
          stats = json.load(open("mutants/mutmut-cicd-stats.json"))
          killed = stats["killed"]
          survived = stats["survived"]
          timeout = stats["timeout"]
          decided = killed + survived + timeout
          score = 100.0 * killed / decided if decided else 0.0
          print(f"gate evidence: mutation score {score:.1f}% "
                f"({killed} killed, {survived} survived, {timeout} timeout)")
          assert score >= 94.0, f"mutation score {score:.1f}% is below the 94% floor"
          PY
      - name: Retain the mutation stats
        if: ${{ always() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
          retention-days: 30
