[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl4write"
version = "0.4.0"
description = "Self-hosted multi-forge code review bot - the org's CodeRabbit replacement."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "pyjwt[crypto]>=2.8"]  # RSA signing is the primary App auth path

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16.5"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# EXPLICIT selection — ruff 0.16 widened its default rule set (BLE001, I001,
# C408...), which broke CI while every 0.15 local run was clean. The rule
# contract is what the code was written against, stated here so ANY ruff
# version checks the same set; widen it deliberately, never by version drift.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is also invoked from OUTSIDE this repo (a sibling checkout runs it
# as `../<repo>/tests/`), where `python -m pytest` puts the INVOCATION
# directory on sys.path and `import fl4write` fails for every module — 59
# collection errors before a single test runs. Rootdir-relative pythonpath
# pins the import root to this repository, so the suite behaves the same from
# any working directory.
pythonpath = ["."]
