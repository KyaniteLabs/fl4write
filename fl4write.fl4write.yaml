repo: KyaniteLabs/fl4write
forges:
  forgejo:
    role: primary
    api_base: https://git.kyanitelabs.tech/api/v1
    token_env: CODESITTER_FORGEJO_TOKEN
  github:
    role: mirror
    api_base: https://api.github.com
    token_env: CODESITTER_GITHUB_TOKEN
model:
  # LAN endpoint is launcher-provided (nucbox exports FL4WRITE_MODEL_ENDPOINT,
  # same pattern as FL4WRITE_TRUSTED_MODEL_ENDPOINTS); the tracked config keeps
  # a placeholder so no host address rides the public repo. Lane swap (CEO
  # order 2026-09-27): primary = CRACK Ornith, fallback = Champion.
  endpoint: ${FL4WRITE_MODEL_ENDPOINT}
  model: CRACK-Ornith-Uncensored
  key_env: ''
  temperature: 0.2
  max_tokens: 8000
fallback_model:
  endpoint: http://192.168.1.72:8908/v1/chat/completions
  model: Qwen3.8-27B
  key_env: ''
  temperature: 0.2
  max_tokens: 8000
review:
  secrets: "Never commit or echo secrets, tokens, or credentials."
  tests: "Changes to logic ship with tests; tests stay green."
  security: "Flag injection, path traversal, unsafe deserialization, unbounded subprocess."
severity_vocab: [Critical, Major, Minor, Nit]
tone: balanced
tone_fork_override: balanced
fix:
  enabled: true  # exhaustive lane implements Forgejo PR create/squash-merge (exhaustive_fix.py:428-433,517-528); token verified as bot login
  merge_own_prs: true
  max_fix_depth: 2
  fork_policy: comment-only
  dependency_policy: skip-patch
post_merge:
  enabled: true
  initial_lookback_h: 24
  max_per_cycle: 10
ci_watch:
  enabled: false  # v1 CI-watch execution is GitHub-only.
  escalate_issues: true
shadow: false
bot_login: fl4write
retro_audit:
  enabled: true
  lookback_days: 90
  max_per_cycle: 5
