- id: cli-budget-invalid
  surface: cli
  command: cd "$QA_CHECKOUT" && FL4WRITE_CYCLE_BUDGET_S=banana python3 -m fl4write.cli
    "$QA_FIXTURE"
  expect_exit: 2
  expect_stderr:
