  - 'ALERT: primary unreachable: forgejo GET /repos/KyaniteLabs/qa-loopback/pulls?state=open&page=1&limit=50'
  - 'fl4write cycle: repo=KyaniteLabs/qa-loopback scanned=0 reviewed=0 shadow=True'
  expect_stderr:
  - 'token_env CODESITTER_FORGEJO_TOKEN is not set in the environment (expect 401s)'
  expected: 'The v1 trigger runs one full poll-invariant cycle against the dead-loopback
    fixture — forge listing fails, degradation is ALERTed on stdout (never a crash,
    never a silent skip), the cycle line reports scanned=0 with shadow=True, and
    the process exits 0. The unset forge token warns at load but is not fatal.
    Findings are log-only because the fixture sets shadow: true.'
  substitutions: 'None.'
  required: true
  sources:
  - file: README.md
    line: 78
    quote: '**Usage:** `python3 -m fl4write.cli <config> [--live] [--fixes] [--issues]
      [--omni]`'
  - file: fl4write/cli.py
    line: 3
    quote: 'Usage: python3 -m fl4write.cli <config.yaml> [--live] [--fixes] [--issues]
      [--omni]'
  - file: fl4write/cli.py
    line: 331
    quote: '    for a in report.alerts:'
  - file: fl4write/cli.py
    line: 341
    quote: 'f"fl4write cycle: repo={report.repo} scanned={report.scanned} "'
  - file: fl4write/config.py
    line: 535
    quote: 'log.warning("forge binding %s (%s): token_env %s is not set in the "'
- id: cli-cycle-live-flag
  surface: cli
  command: cd "$QA_CHECKOUT" && python3 -m fl4write.cli "$QA_FIXTURE" --live
  expect_exit: 0
  expect_stdout:
  - 'fl4write cycle: repo=KyaniteLabs/qa-loopback scanned=0 reviewed=0 shadow=False'
  expected: '--live is the explicit live belt: the cycle line reports shadow=False
    regardless of the config''s shadow field. With the forge unreachable nothing
    can post (scanned=0), so the flag is observable safely, credential-free.'
  substitutions: 'None.'
  required: true
  sources:
  - file: fl4write/cli.py
    line: 260
    quote: '    if live:'
  - file: fl4write/cli.py
    line: 261
    quote: '        config = config.model_copy(update={"shadow": False})'
- id: cli-cycle-omni-flag
  surface: cli
  command: cd "$QA_CHECKOUT" && python3 -m fl4write.cli "$QA_FIXTURE" --omni
  expect_exit: 0
  expect_stdout:
  - omni=0/0f
  - 'scanned=0 reviewed=0 shadow=True'
  expected: '--omni forces the one-shot prelaunch kick (omnisweep enabled, per-cycle
    file cap 50) through a NORMAL run_cycle — with the forge tree unlistable the
    sweep degrades to omni=0/0f and exits 0, proving the flag is live (not dead)
    without a model or forge.'
  substitutions: 'None.'
  required: true
  sources:
  - file: fl4write/cli.py
    line: 251
    quote: '    if "--omni" in sys.argv:'
  - file: fl4write/cli.py
    line: 258
    quote: '"omnisweep": config.omnisweep.model_copy(update={"enabled": True, "max_files_per_cycle":
      50}),'
- id: cli-cycle-fixes-issues
  surface: cli
  command: cd "$QA_CHECKOUT" && python3 -m fl4write.cli "$QA_FIXTURE" --fixes --issues
  expect_exit: 0
  expect_stdout:
  - 'fl4write cycle: repo=KyaniteLabs/qa-loopback scanned=0'
  expected: 'The fleet runner''s exact per-repo invocation (run-cycle.sh calls the
    CLI with --fixes --issues) parses both lane flags and completes a cycle on
    the fixture (fix lane disabled in the fixture; issues lane opt-out by default).'
  substitutions: 'None.'
  required: true
  sources:
  - file: run-cycle.sh
    line: 182
    quote: '    OUT=$(timeout 900 python3 -m fl4write.cli "$f" --fixes --issues 2>&1)'
  - file: fl4write/config.py
    line: 256
    quote: 'issues_enabled: bool = False  # issues-lane triage (comment-only)'
- id: cli-cycle-kinocut-seam
  surface: cli
  command: cd "$QA_CHECKOUT" && FL4WRITE_FORGEJO_API_BASE=http://127.0.0.1:9/api/v1
    python3 -m fl4write.cli kinocut.fj.fl4write.yaml
  expect_exit: 0
  expect_stdout:
  - 'ALERT: config probe inconclusive for KyaniteLabs/kinocut (forge unqueryable — not an adoption-loss claim)'
  - 'fl4write cycle: repo=KyaniteLabs/kinocut scanned=0 reviewed=0 shadow=False'
  expected: 'The PR #26 environment seam, exercised on the TRACKED reference config:
    the tracked .fj config''s api_base is the ${FL4WRITE_FORGEJO_API_BASE}
    placeholder, the env var supplies a dead loopback, the config loads, and the
    cycle degrades loudly (ALERTs, scanned=0, exit 0). This is the credential-free
    shape QA uses for every Forgejo-primary repo. The deployed runner''s real value
    is provisioned out-of-band (platform chain t_72e4d9a7) and is NOT exercised
    here.'
  substitutions: 'The dead-loopback value above; QA may substitute any loopback
    address that refuses connections.'
  required: true
  sources:
  - file: kinocut.fj.fl4write.yaml
    line: 5
    quote: 'api_base: ${FL4WRITE_FORGEJO_API_BASE}'
  - file: run-cycle.sh
    line: 103
    quote: 'export FL4WRITE_FORGEJO_API_BASE=$(grep "^export FL4WRITE_FORGEJO_API_BASE="
      ~/.bashrc 2>/dev/null | head -1 | cut -d= -f2- | tr -d ''"'')'
  - file: README.md
    line: 107
    quote: 'loopback), and the Forgejo configs'' `api_base` comes from the runner'
- id: tiers-plan-envelope
  surface: cli
  command: 'set -o pipefail; cd "$QA_CHECKOUT" && python3 -m fl4write.tiers --plan
    "$QA_FIXTURE" | python3 -c ''import json,sys; p=json.load(sys.stdin); assert
    isinstance(p["due"], list) and all(isinstance(d, str) for d in p["due"]); assert
    isinstance(p["alerts"], list) and all(isinstance(a, str) for a in p["alerts"]);
    assert isinstance(p["summary"], str); print("envelope-ok", len(p["due"]), "due")'''
  expect_exit: 0
  expect_stdout:
  - envelope-ok
  expected: 'The tier scheduler emits ONE JSON envelope {due, alerts, summary} on
    stdout and exits 0 — the exact shape run-cycle.sh parses and validates. The
    fixture (Forgejo-primary, no state file) classifies WARM per the Forgejo
    default; due/alerts content may vary with cadence watermarks, so the assertion
    is the envelope shape, not a pinned count.'
  substitutions: 'None.'
  required: true
  sources:
  - file: fl4write/tiers.py
    line: 228
    quote: 'help="ONE envelope {due, alerts, summary} — the runner parses this "'
  - file: run-cycle.sh
    line: 116
    quote: 'python3 -m fl4write.tiers --plan *.fl4write.yaml > ~/.fl4write/plan.json
      2>>"$LOG"'
  - file: fl4write/tiers.py
    line: 13
    quote: 'org merges in ~60s — a busy Forgejo repo silently parked cold is a'
- id: check-dirty-clean
  surface: ops-shell
  command: FL4WRITE_CHECKOUT="$QA_SANDBOX" bash "$QA_SANDBOX/check-dirty.sh"
  expect_exit: 0
  expect_stdout:
  - clean
  expected: 'The C2 guard certifies the pristine sandbox clone as clean (single line
    "clean"). FL4WRITE_CHECKOUT is the documented testability override pointing
    the guard at the QA sandbox instead of a deployment checkout.'
  substitutions: 'None.'
  required: true
  sources:
  - file: check-dirty.sh
    line: 6
    quote: 'CHECKOUT="${FL4WRITE_CHECKOUT:-$HOME/workspaces/fl4write}"'
  - file: check-dirty.sh
    line: 30
    quote: echo "clean"
- id: run-cycle-contention
  surface: ops-shell
  command: 'flock "$QA_LOCK" -c ''sleep 10'' & HOLDER=$!; sleep 1; env -i HOME="$QA_HOME"
    TERM=dumb PATH=/usr/bin:/bin LANG=C.UTF-8 bash "$QA_SANDBOX/run-cycle.sh";
    rc=$?; kill -9 $HOLDER 2>/dev/null; wait $HOLDER 2>/dev/null; exit $rc'
  expect_exit: 0
  expect_stdout: []
  expect_stderr: []
  expect_stdout_empty: true
  expect_stderr_empty: true
  expect_no_log_delta: true
  expected: 'With another holder on ~/.fl4write/runner.lock, run-cycle.sh''s
    nonblocking flock fails with rc=1 — genuine contention — and the script exits
    0 SILENTLY (no output, no runner.log line): one runner at a time, the concurrent
    cycle is not an error.'
  substitutions: 'None.'
  required: true
  sources:
  - file: run-cycle.sh
    line: 27
    quote: 'flock -n 9 2>>"$LOG" || {'
  - file: run-cycle.sh
    line: 29
    quote: '    if [ "$rc" -eq 1 ]; then exit 0; fi  # genuine contention: another
      cycle runs'

negative_cases:
# ------------------------------------------------------------- CLI refusal guards
- id: cli-unknown-flag
  surface: cli
  command: cd "$QA_CHECKOUT" && python3 -m fl4write.cli --bogus
  expect_exit: 2
  expect_stderr:
  - 'unknown flag(s): --bogus — refusing to run (typo guard)'
  expected: 'Unknown flags are refused before anything runs — a typo like --lvie for
    --live cannot silently run the cycle in the wrong mode. Exit 2, one-line
    diagnostic.'
  substitutions: 'None.'
  required: true
  sources:
  - file: fl4write/cli.py
    line: 204
    quote: 'print(f"unknown flag(s): {'', ''.join(unknown)} — refusing to run (typo
      guard)",'
  - file: fl4write/cli.py
    line: 162
    quote: '_KNOWN_FLAGS = ("--live", "--fixes", "--issues", "--omni")'
  - file: README.md
    line: 79
    quote: '(mode flag typos are refused — unknown flags exit 2).'
- id: cli-no-args
