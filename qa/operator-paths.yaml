  surface: ops-shell
  command: env -i HOME="$QA_HOME" TERM=dumb PATH=/usr/bin:/bin LANG=C.UTF-8 bash
    "$QA_SANDBOX/run-cycle.sh"
  expect_exit: 1
  expect_log_delta:
  - 'ERROR: no gh token available'
  expected: 'With gh present on PATH but no credential reachable from the isolated
    HOME (or gh absent entirely), `gh auth token` yields nothing and the runner
    aborts before any cycle: ERROR to runner.log, exit 1. On a host with a
    SYSTEM-level gh credential this gate cannot trigger; treat an unexpected
    pass-through as an environment anomaly to investigate, not a pass.'
  substitutions: 'None.'
  required: true
  sources:
  - file: run-cycle.sh
    line: 34
    quote: 'export CODESITTER_GITHUB_TOKEN=$(gh auth token 2>/dev/null)'
  - file: run-cycle.sh
    line: 36
    quote: '    echo "$(date -Iseconds) ERROR: no gh token available" >> "$LOG"'
- id: run-cycle-dirty-abort
  surface: ops-shell
  command: 'echo qa > "$QA_SANDBOX/untracked-probe.txt"; env -i HOME="$QA_HOME" TERM=dumb
    PATH="$QA_SHIM_GH:/usr/bin:/bin" LANG=C.UTF-8 bash "$QA_SANDBOX/run-cycle.sh";
    rc=$?; rm -f "$QA_SANDBOX/untracked-probe.txt"; exit $rc'
  expect_exit: 1
  expect_log_delta:
  - 'ERR: dirty checkout — cycle ABORTED (commit/stash before the runner self-pulls)'
  expected: 'The gh token gate is satisfied by the credential-free stub shim; the
    C2 guard then finds the untracked probe file and the whole fleet cycle aborts
    BEFORE self-update — uncommitted files are invisible to git pull and must not
    run. The command removes its own probe file afterwards.'
  substitutions: 'None.'
  required: true
  sources:
  - file: run-cycle.sh
    line: 48
    quote: 'if ! GUARD_OUT=$(bash check-dirty.sh 2>&1); then'
  - file: run-cycle.sh
    line: 50
    quote: '    echo "$(date -Iseconds) ERR: dirty checkout — cycle ABORTED (commit/stash
      before the runner self-pulls)" >> "$LOG"'
  - file: run-cycle.sh
    line: 47
    quote: '# dirty checkout must not run (the guard was previously never invoked).'
- id: run-cycle-selfupdate-abort
  surface: ops-shell
  command: 'git -C "$QA_SANDBOX" remote remove origin 2>/dev/null; env -i HOME="$QA_HOME"
    TERM=dumb PATH="$QA_SHIM_GH:/usr/bin:/bin" LANG=C.UTF-8 bash "$QA_SANDBOX/run-cycle.sh"'
  expect_exit: 1
  expect_log_delta:
  - 'ERR: self-update (git pull) failed — cycle ABORTED (retry next hour)'
  expected: 'Pull failure IS FATAL: with the sandbox clean (guard passes via the
    stub gh) but no origin remote, `git pull -q origin main` fails and the cycle
    aborts — running stale code that reviews today''s PRs with yesterday''s rules
    is never alert-and-continue. Runs last among the run-cycle cases because it
    removes the sandbox''s origin remote.'
  substitutions: 'None.'
  required: true
  sources:
  - file: run-cycle.sh
    line: 57
    quote: 'if ! git pull -q origin main 2>>"$LOG"; then'
  - file: run-cycle.sh
    line: 58
    quote: '    echo "$(date -Iseconds) ERR: self-update (git pull) failed — cycle
      ABORTED (retry next hour)" >> "$LOG"'

surface_absence:
- id: no-server-surface
  surfaces_declared_absent: [mcp, http, browser-ui]
  statement: 'The fl4write package exposes NO MCP, HTTP or browser-UI server surface.
    Its operator surfaces are exactly the CLI module mains (fl4write.cli the v1
    trigger; fl4write.tiers the scheduler; fl4write.reliability the eval harness;
    fl4write.exhaustive the draft loop) and the two ops shell scripts (run-cycle.sh,
    check-dirty.sh). Source-verified at the merge SHA — the only listener in the
    package is the per-process model proxy bound to a filesystem AF_UNIX socket
    (never a network interface) used to serialize model-route calls — not an
    externally reachable service. No entries are invented for absent surfaces.'
  sources:
  - file: fl4write/model_proxy.py
    line: 104
    quote: 'with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as stream:'
