supporting_observations:
- id: run-cycle-scheduler-failure-gate
  surface: ops-shell
  statement: 'With the token gate satisfied (stub gh), the sandbox clean and the
    self-update pull a no-op success (up-to-date detached HEAD), run-cycle.sh
    reaches the scheduler; a PATH whose python3 cannot import fl4write makes the
    scheduler die, and the runner exits 1 with "ERR: tier scheduler failed —
    fleet NOT cycled this hour" — the loud-failure contract (a dead scheduler
    never looks like a healthy empty cycle). Observed during catalog authoring
    on the authoring host; kept as a supporting observation rather than a
    required path because its trigger is host-Python-dependent.'
  sources:
  - file: run-cycle.sh
    line: 134
