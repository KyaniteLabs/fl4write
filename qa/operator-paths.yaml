# FL4WRITE operator-path catalog — the QA input contract for KyaniteLabs/fl4write.
#
# Schema aligned with the staged Q1 format (Epoch.yaml): schema_version, policy,
# setup, paths[] with id/surface/command/expected/sources, negative_cases,
# surface_absence, restricted/fixture-gated entries, coverage. Every executed
# entry additionally carries machine-checkable assertions the shipped runner
# (qa/run.sh) enforces:
#   expect_exit      — required exit code of the command
#   expect_stdout    — substrings that MUST appear on stdout
#   expect_stderr    — substrings that MUST appear on stderr
#   expect_log_delta — substrings that MUST appear in the runner.log bytes
#                      appended by this command (sandbox runner.log)
#   expect_no_log_delta: true — the command must append NOTHING to runner.log
# Commands are bash strings executed with cwd=$QA_CHECKOUT under the isolated
# environment built by qa/run.sh (empty HOME, no host credentials,
# FL4WRITE_FORGEJO_API_BASE deliberately unset in the base env; the one entry
# that needs it sets it inline). All commands pass `bash -n` (preflight).
#
# Landed unexecuted: run_status stays NOT_EXECUTED until QA re-executes this
# catalog at the Security-merged SHA that contains it.

schema_version: 1
status: catalog_landed_not_executed
run_status: NOT_EXECUTED

policy:
  pass: 'Every required action executes and meets its observable assertion on the
    Security-merged default-branch SHA.'
  blocked: 'Missing fixture, dependency, consent or path assertions prevent a full
    pass; discovery/help never counts as end-to-end execution.'
  evidence: 'For every path retain exact command, SHA, exit code, stdout/stderr,
    asserted observations and hashes. Sanitize before delivery.'
  isolation: 'New clone pinned at the merge SHA; empty HOME for product subprocesses;
    no real user data or credentials; dead-loopback (127.0.0.1:9) forge/model endpoints
    wherever a route would otherwise leave the host; state written only under the
    isolated HOME. The QA host''s own gh auth, tokens and model keys are never read
    (commands run through a constructed env, not the inherited one).'
  resources: 'One bounded product test at a time; dead-loopback endpoints answer
    instantly (connection refused); total runtime of the full catalog is seconds,
    not minutes.'
  change_control: 'Catalog and qa/run.sh changes require a repository PR and Security
    merge. A runner EXISTS in this repo (qa/run.sh) and executes the catalog
    end-to-end.'

product: FL4WRITE (package fl4write)
repository: KyaniteLabs/fl4write
source_revision: 397c2ed2f3c182653ea2d2055f0b91a4066029ac
revision_policy: 'Local-source provenance only; fetch/verify the actual Security
  merge SHA during QA (this catalog''s own merge or later) and pin the checkout
  to it. source_revision above is the last Security-merged SHA before this catalog
  existed; every citation''s file/line/quote was verified against it.'

setup:
- id: isolate
  surface: qa-harness
  command: 'mkdir -p "$QA_WORK/home/.config" "$QA_WORK/home/.fl4write" "$QA_WORK/fixtures"
    "$QA_WORK/nonrepo" "$QA_WORK/evidence"

    # Product subprocesses run with env -i style constructed environments (see
    # qa/run.sh): HOME under QA_WORK, no host credentials, FL4WRITE_FORGEJO_API_BASE
    # unset in the base env (set inline only by the seam entry).'
  expected: 'All product writes (state, plan, runner.log) land under the disposable
    QA_HOME; no host credential is readable.'
  sources:
  - file: run-cycle.sh
    line: 15
    quote: 'mkdir -p ~/.fl4write || { echo "$(date -Iseconds) ERR: cannot create ~/.fl4write
      — aborting" >> "$LOG"; exit 1; }'
- id: clone_and_pin
  surface: qa-harness
  command: 'MERGE_SHA="${FL4WRITE_QA_SHA:-$(git -C "$QA_SRC" rev-parse HEAD)}"

    git clone --no-local "$QA_SRC" "$QA_CHECKOUT"

    git -C "$QA_CHECKOUT" checkout --detach "$MERGE_SHA"

    test "$(git -C "$QA_CHECKOUT" rev-parse HEAD)" = "$MERGE_SHA"'
  expected: 'New clone at exactly the merge SHA; fail before install if identity or
    ancestry cannot be verified. Verify PR merged state and the Security merge
    receipt separately.'
  sources:
  - file: pyproject.toml
    line: 1
    quote: '[build-system]'
- id: install
  surface: qa-harness
  command: 'python3 -m venv "$QA_VENV"

    "$QA_VENV/bin/pip" install -e "$QA_CHECKOUT"

    "$QA_VENV/bin/python" -c "import fl4write, pydantic, yaml, jwt; print(''install-ok'')"'
  expected: 'Exit 0; the package and its declared dependencies (pydantic>=2.5,
    pyyaml>=6, pyjwt[crypto]>=2.8) import from the pinned checkout. A bare host
    python3 is NOT sufficient — the CLI imports pydantic at module load, so this
    step is required for every CLI path below.'
  sources:
  - file: pyproject.toml
    line: 12
    quote: 'dependencies = ["pydantic>=2.5", "pyyaml>=6", "pyjwt[crypto]>=2.8"]  #
      RSA signing is the primary App auth path'
- id: sandbox-runner-checkout
  surface: qa-harness
  command: 'git clone --no-local "$QA_CHECKOUT" "$QA_HOME/workspaces/fl4write"

    git -C "$QA_HOME/workspaces/fl4write" checkout --detach "$MERGE_SHA"

    mkdir -p "$QA_HOME/.fl4write"

    rm -f "$QA_HOME/workspaces/fl4write/runner.log"'
  expected: 'run-cycle.sh''s cd target (~/workspaces/fl4write) exists as a clean clone
    at the merge SHA; the lock dir exists; a stale runner.log from an earlier
    run cannot pollute log-delta assertions. runner.log and logs/ are gitignored,
    so the guard stays clean across cases.'
  sources:
  - file: run-cycle.sh
    line: 42
    quote: 'cd ~/workspaces/fl4write || { echo "$(date -Iseconds) ERR: cannot cd to
      ~/workspaces/fl4write" >> "$LOG"; exit 1; }'
  - file: .gitignore
    line: 6
    quote: runner.log
- id: fixtures
  surface: qa-harness
  command: 'cp "$QA_SRC/qa/fixtures/qa-loopback.fl4write.yaml" "$QA_WORK/fixtures/"

    mkdir -p "$QA_WORK/shim"

    cp "$QA_SRC/qa/fixtures/shim/gh" "$QA_WORK/shim/gh" && chmod +x "$QA_WORK/shim/gh"

    mkdir -p "$QA_WORK/shim-noflock"

    for b in env bash sh mkdir date grep head cut tr cat; do ln -sf "/usr/bin/$b"
    "$QA_WORK/shim-noflock/$b"; done

    ls "$QA_WORK/shim-noflock/flock" 2>/dev/null && exit 1 || true'
  expected: 'The dead-loopback config fixture, the credential-free gh stub (satisfies
    run-cycle.sh''s token gate with a fake value) and a PATH shim that contains
    every binary run-cycle.sh needs BEFORE its flock gate EXCEPT flock itself.'
  sources:
  - file: qa/fixtures/qa-loopback.fl4write.yaml
    line: 11
    quote: 'api_base: http://127.0.0.1:9/api/v1'
  - file: qa/fixtures/shim/gh
    line: 7
    quote: echo qa-stub-token

paths:
