repo: simon/chance
forges:
  forgejo:
    role: primary
    api_base: ${FL4WRITE_FORGEJO_API_BASE}
    token_env: CODESITTER_FORGEJO_TOKEN
model:
  endpoint: https://api.deepinfra.com/v1/openai/chat/completions
  model: deepseek-ai/DeepSeek-V4-Flash-0731
  key_env: CODESITTER_DEEPSEEK_KEY
  temperature: 0.2
  max_tokens: 8000
fallback_model:
  endpoint: http://127.0.0.1:8908/v1/chat/completions
  model: Qwen3.8-27B
  key_env: ''
  temperature: 0.2
  max_tokens: 4000
review:
  secrets: "Never commit or echo secrets, tokens, or credentials."
  tests: "Changes to logic ship with tests; tests stay green."
  security: "Flag injection, path traversal, unsafe deserialization, unbounded subprocess."
severity_vocab: [Critical, Major, Minor, Nit]
tone: balanced
tone_fork_override: balanced
fix:
  enabled: false
  merge_own_prs: false
  max_fix_depth: 2
  fork_policy: comment-only
  dependency_policy: skip-patch
post_merge:
  enabled: true
  initial_lookback_h: 48
  max_per_cycle: 10
retro_audit:
  enabled: true
  lookback_days: 90
  max_per_cycle: 5
shadow: false
